<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DataRefine Studio</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0f1115; color-scheme: dark; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; background: #0f1115; color: #e8eaed;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
      }
      #boot-splash .mark {
        width: 72px; height: 72px; border-radius: 20px; display: grid; place-items: center;
        color: #fff; font-size: 32px; font-weight: 800;
        background: linear-gradient(135deg, #5b8def, #3d6fd8);
        box-shadow: 0 18px 40px rgba(91, 141, 239, 0.35);
      }
      #boot-splash .title { margin-top: 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.04em; }
      #boot-splash .sub { font-size: 13px; color: #8b919c; }
      #boot-splash .bar { width: 196px; height: 4px; margin-top: 10px; border-radius: 99px; overflow: hidden; background: #22262f; }
      #boot-splash .bar > span {
        display: block; height: 100%; width: 40%; border-radius: 99px;
        background: linear-gradient(90deg, #5b8def, #3d6fd8);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      #boot-splash .phase { font-size: 12px; color: #8b919c; }
      #boot-splash.is-out { opacity: 0; pointer-events: none; transition: opacity 0.16s ease; }
      @keyframes boot-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
    </style>
  </head>
  <body class="bg-ink-950 text-slate-100 antialiased">
    <div id="boot-splash">
      <div class="mark">D</div>
      <div class="title">DataRefine Studio</div>
      <div class="sub">Local-first data cleaning</div>
      <div class="bar"><span></span></div>
      <div class="phase">Starting core engine…</div>
    </div>
    <div id="root"></div>
    <script>
      window.setTimeout(function () {
        var splash = document.getElementById("boot-splash");
        var root = document.getElementById("root");
        if (!splash || !root || root.childElementCount !== 0) return;
        var p = splash.querySelector(".phase");
        if (p) p.textContent = "Core engine is taking a little longer…";
      }, 1800);
      window.setTimeout(function () {
        var splash = document.getElementById("boot-splash");
        var root = document.getElementById("root");
        if (!splash || !root) return;
        if (root.childElementCount === 0) {
          var p = splash.querySelector(".phase");
          if (p) p.textContent = "UI did not start. Close and run npm install --legacy-peer-deps, then rebuild.";
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
